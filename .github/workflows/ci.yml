name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go vet -tags earstrip_cgo ./...
      - run: go test ./...
      - run: go test -race -short ./...
      # the oracle needs libc++ (see internal/oracle/doc.go): macOS has it
      - name: Differential tests against the C++ header
        if: runner.os == 'macOS'
        run: go test -tags earstrip_cgo -short ./internal/oracle/...

  conformance:
    # macOS for libc++, see internal/oracle/doc.go
    runs-on: macos-latest
    env:
      EARSTRIP_REQUIRE_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/cache@v4
        with:
          path: data
          key: bench-data-1
      - run: ./scripts/fetch-data.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: go test -run TestConformance -v -timeout 30m .
      - name: The C++ against the stored hashes, then go-earstrip against the C++ on every data file
        run: go test -tags earstrip_cgo -timeout 60m ./internal/oracle/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # golangci-lint v2.13.2 cannot read the export data of Go 1.27.3 (version 5); pinned together
          go-version: "1.27.1"
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Lint with the cgo oracle
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --build-tags earstrip_cgo ./...
