name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go vet -tags earstrip_cgo ./...
      - run: go test ./...
      - name: Differential tests against the C++ header
        run: go test -tags earstrip_cgo -short ./internal/oracle/...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/cache@v4
        with:
          path: data
          key: bench-data-1
      - run: ./scripts/fetch-data.sh
      - run: go test -run TestConformance -v -timeout 30m .
      - name: The C++ against the stored hashes, then go-earstrip against the C++ on every data file
        run: go test -tags earstrip_cgo -timeout 60m ./internal/oracle/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
